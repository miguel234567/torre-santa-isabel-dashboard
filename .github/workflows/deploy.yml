name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # Permite trigger manual desde GitHub UI

# Cancela deploys obsoletos si llegan commits seguidos
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    name: Validar sintaxis JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar JS del dashboard
        run: |
          node -e "
            const fs = require('fs');
            const h = fs.readFileSync('gantt-santa-isabel.html', 'utf8');
            const scripts = [...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            let ok = true;
            scripts.forEach((s, i) => {
              try {
                new Function(s[1]);
                console.log('✅ script', i + 1, 'OK (' + s[1].length + ' chars)');
              } catch(e) {
                console.error('❌ script', i + 1, ':', e.message);
                ok = false;
              }
            });
            if (!ok) process.exit(1);
          "

      - name: Verificar HTML básico
        run: |
          test -f gantt-santa-isabel.html
          SIZE=$(stat -c%s gantt-santa-isabel.html)
          echo "Tamaño dashboard: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "❌ Dashboard sospechosamente pequeño ($SIZE bytes)"
            exit 1
          fi
          grep -q '<section class="tab-content active" id="tab-kpis">' gantt-santa-isabel.html || (echo "❌ Falta tab-kpis" && exit 1)
          echo "✅ HTML básico OK"

  deploy:
    name: Deploy a GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar carpeta de publicación
        run: |
          mkdir -p _site
          cp gantt-santa-isabel.html _site/index.html
          if [ -d "IMAGENES_LOGOS" ]; then
            cp -r IMAGENES_LOGOS _site/
          fi
          ls -la _site/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Resumen
        run: |
          echo "🚀 Publicado en ${{ steps.deployment.outputs.page_url }}"
          echo "   Commit: ${{ github.sha }}"
